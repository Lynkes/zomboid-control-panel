services:
  panel:
    image: zomboid-panel-allinone:latest
    build:
      context: ../source
      dockerfile: docker/all-in-one/Dockerfile
    container_name: zomboid-panel
    restart: unless-stopped
    ports:
      - "3001:3001"
      # PZ DefaultPort and UDPPort (UDP). Every server in this container
      # uses two ports in a row, so the default range fits five servers:
      # 16261-16262 for the first, 16263-16264 for the second, and so on.
      # Set PZ_GAME_PORTS in .env to change it, then rerun bootstrap.sh.
      - "${PZ_GAME_PORTS:-16261-16270}:${PZ_GAME_PORTS:-16261-16270}/udp"
    environment:
      NODE_ENV: production
      PZ_SERVER_PATH: /pz-server
      PZ_SAVE_PATH: /zomboid
      # Extra servers created from the panel live here, on their own volume.
      PZ_EXTRA_SERVERS_PATH: /pz-servers
      # Tells the panel which game ports players can reach.
      PZ_PUBLISHED_GAME_PORTS: ${PZ_GAME_PORTS:-16261-16270}
      PZ_SERVER_BAT: start-server.sh
      RCON_HOST: 127.0.0.1
      RCON_PORT: 27015
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PANEL_LAN_IP: ${PANEL_LAN_IP:-}
      PANEL_WAN_IP: ${PANEL_WAN_IP:-}
      PANEL_DOCKER_UPDATER_URL: http://zomboid-panel-updater:3100
      PANEL_DOCKER_UPDATER_TOKEN: ${PANEL_DOCKER_UPDATER_TOKEN:?Set PANEL_DOCKER_UPDATER_TOKEN in .env}
    volumes:
      - panel-data:/app/data
      - panel-logs:/app/logs
      - pz-server:/pz-server
      - zomboid-data:/zomboid
      - pz-servers:/pz-servers
    depends_on:
      updater:
        condition: service_healthy

  updater:
    image: zomboid-panel-updater:latest
    build:
      context: ../source
      dockerfile: docker/all-in-one/updater/Dockerfile
    container_name: zomboid-panel-updater
    restart: unless-stopped
    environment:
      UPDATE_TOKEN: ${PANEL_DOCKER_UPDATER_TOKEN:?Set PANEL_DOCKER_UPDATER_TOKEN in .env}
      BUILD_ROOT: /build
      COMPOSE_FILE: /build/ctx/docker-compose.yml
      PANEL_CONTAINER: zomboid-panel
      PANEL_IMAGE: zomboid-panel-allinone:latest
      GITHUB_REPOSITORY: fpsacha/zomboid-control-panel
      # security audit M5: optional SHA-256 of the release source archive.
      # When set, the updater refuses any archive that does not match it --
      # which means it pins ONE release: every other version (newer ones
      # included) is refused until you set the new hash and recreate this
      # container. See SECURITY.md.
      UPDATE_SHA256: ${PANEL_DOCKER_UPDATE_SHA256:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PANEL_BUILD_DIR:?Set PANEL_BUILD_DIR in .env}:/build
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  panel-data:
  panel-logs:
  pz-server:
  zomboid-data:
  pz-servers: