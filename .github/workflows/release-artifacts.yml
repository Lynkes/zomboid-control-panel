name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-zip
            binary_artifact_name: windows-binary
            archive_file: ZomboidControlPanel-windows.zip
            binary_file: ZomboidControlPanel.exe
            build_arg: --windows
          - os: ubuntu-latest
            artifact_name: linux-tarball
            binary_artifact_name: linux-binary
            archive_file: ZomboidControlPanel-linux.tar.gz
            binary_file: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit

      - name: Install client dependencies
        run: npm install --no-audit
        working-directory: client

      - name: Build
        run: node build.js ${{ matrix.build_arg }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          chmod +x release/ZomboidControlPanel release/start.sh
          tar -czf ${{ matrix.archive_file }} -C release .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: release/${{ matrix.binary_file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release files
        uses: actions/checkout@v4

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: .

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: .

      - name: Package browser extension
        run: |
          set -euo pipefail
          cd browser-extension
          zip -r ../zomboid-panel-extension.zip . -x '*.DS_Store'

      - name: Generate checksums
        run: |
          sha256sum \
            ZomboidControlPanel.exe \
            ZomboidControlPanel \
            ZomboidControlPanel-windows.zip \
            ZomboidControlPanel-linux.tar.gz \
            zomboid-panel-extension.zip \
            docker-compose.install.yml \
            Dockerfile > checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading assets."
          else
            gh release create "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release $release_tag" \
              --generate-notes
          fi

      - name: Remove obsolete release-manifest.json from prior releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          gh release delete-asset "$release_tag" release-manifest.json --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ZomboidControlPanel.exe \
              ZomboidControlPanel \
              ZomboidControlPanel-windows.zip \
              ZomboidControlPanel-linux.tar.gz \
              zomboid-panel-extension.zip \
              docker-compose.install.yml \
              Dockerfile \
              checksums.txt; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          exit 1
