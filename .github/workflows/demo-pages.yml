name: Deploy Demo To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - client/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no npm code and checks
# out nothing, gets write access.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Installs and runs the client's build tooling, so it gets no write token:
  # a compromised build dependency could otherwise read the job's token
  # (actions/checkout leaves it in .git/config) and push to the repository or
  # replace release assets. The built site leaves this job only as an
  # artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci installs exactly what client/package-lock.json pins. The
      # lockfile carries an entry for every platform package vite pulls in
      # (rolldown/lightningcss linux gnu and musl included): where an entry
      # has no libc field npm installs both variants, and the loader picks
      # the right one.
      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --prefer-offline

      - name: Build static demo
        working-directory: client
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: "/zomboid-control-panel/"
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-site
          path: client/dist
          if-no-files-found: error
          retention-days: 1

  # Publishes the built files to the gh-pages branch (the repository's Pages
  # source), exactly as before. No checkout and no npm here: the only code
  # that runs with the write token is the pinned publish action.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-site
          path: site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
